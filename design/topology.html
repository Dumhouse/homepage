<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topology · Home Services</title>
<script src="assets/boot.js?v=30"></script>
<link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="assets/app.css?v=32">
<script src="assets/app.js?v=32" defer></script>
</head>
<body data-page="network" data-crumbs="Network|network.html / Topology">
<div class="app">
<aside class="sidebar" id="sidebar"></aside>
<div class="main">
<header class="topbar" id="topbar"></header>
<main class="content">

  <div class="page-head">
    <div><h1>Topology</h1><div class="sub">How traffic reaches each machine — built automatically from routes, addresses and links</div></div>
    <div class="actions">
      <div class="chips" data-single><button class="chip on">Everything</button><button class="chip">Only public</button><button class="chip">Only problems</button></div>
      <button class="btn" data-say="Exported topology.svg"><i data-i="download"></i>Export SVG</button>
    </div>
  </div>

  <div class="topo"><svg id="topo" viewBox="0 0 1100 570" role="img" aria-label="Network topology"></svg></div>

  <div class="legend mt-16">
    <span><i style="background:var(--violet)"></i>public via Cloudflare Tunnel</span>
    <span><i style="background:var(--border-2)"></i>LAN link</span>
    <span><i style="background:var(--warn)"></i>needs attention</span>
    <span><i style="border:1px dashed var(--muted)"></i>stopped</span>
    <span class="muted">Click any box to open it.</span>
  </div>

<script>
  const W = 150, H = 40;
  const nodes = [
    // id, x, y, name, sub, state
    ['inet', 20, 110, 'Internet', 'visitors', ''],
    ['cf', 20, 250, 'Cloudflare', 'tunnel · DNS', ''],
    ['rtr', 215, 60, 'Main router', '192.168.10.1', ''],
    ['edge', 215, 250, 'edge · Caddy', '.254 · 4 domains', ''],
    ['mt', 215, 420, 'MikroTik', '.151 ⇄ 88.1', 'warn'],
    ['pve', 425, 52, 'proxmox', '.250 · node', ''],
    ['ntfy', 440, 112, 'ntfy', '.252', ''], ['vault', 610, 112, 'vaultwarden', '.253', ''],
    ['home', 440, 170, 'ops · Gatus', '.246 · home.home.example', ''], ['forgejo', 610, 170, 'forgejo', '.247', ''],
    ['clavis', 440, 228, 'clavis', '.234', ''], ['acme', 610, 228, 'acme-staging', '.240 · 1 down', 'bad'],
    ['tg', 440, 286, 'telegram', '.162', ''], ['hs', 610, 286, 'homeservices', '.101 · this app', ''],
    ['haos', 440, 344, 'haos', '.200', ''], ['reg', 610, 344, 'registry-alpine', '.40', ''],
    ['book', 440, 402, 'bookstack', '.245', ''], ['adg', 610, 402, 'adguard', 'stopped', 'off'],
    ['hb', 860, 110, 'statusboard', '88.250', ''],
    ['s251', 860, 170, '192.168.2.251', 'unregistered', 'warn'],
    ['s254', 860, 230, '192.168.2.254', 'unregistered', 'warn'],
  ];
  const at = Object.fromEntries(nodes.map(n => [n[0], n]));
  const L = id => [at[id][1], at[id][2] + H / 2], R = id => [at[id][1] + W, at[id][2] + H / 2];
  const T = id => [at[id][1] + W / 2, at[id][2]], B = id => [at[id][1] + W / 2, at[id][2] + H];
  const curve = (a, b) => { const mx = (a[0] + b[0]) / 2; return `M${a} C${mx},${a[1]} ${mx},${b[1]} ${b}`; };
  const edges = [
    ['', `M${B('inet')} L${T('cf')}`],
    ['', curve(R('inet'), L('rtr'))],
    ['pub', curve(R('cf'), L('edge'))],
    ['pub', curve(R('edge'), L('ntfy'))], ['pub', curve(R('edge'), L('home'))],
    ['pub', `M${R('edge')} H414 V100 H600 V132 H610`],
    // LAN bus at x=400
    ['', 'M400,67 V470'], ['', `M${R('rtr')} H400`], ['', `M${R('mt')} H400`], ['', 'M400,67 H425'],
    // MikroTik to LAN 88 (go under proxmox zone)
    ['', `M${B('mt')} V545 H1050 V130`],
    ['', `M${R('hb')} H1050`], ['', `M${R('s251')} H1050`], ['', `M${R('s254')} H1050`],
  ];
  const svg = document.getElementById('topo');
  let html = `
    <rect class="zone" x="8" y="20" width="175" height="290" rx="12"/><text class="zone-l" x="22" y="40">Internet</text>
    <rect class="zone" x="200" y="20" width="620" height="510" rx="12"/><text class="zone-l" x="214" y="40">LAN 192.168.10.0/24</text>
    <rect class="zone" x="420" y="45" width="385" height="410" rx="10" style="stroke-dasharray:none;opacity:.7"/>
    <rect class="zone" x="840" y="20" width="250" height="300" rx="12"/><text class="zone-l" x="854" y="40">LAN 192.168.2.0/24</text>
    <text class="zone-l" x="406" y="500" style="text-transform:none">LAN switch</text>`;
  html += edges.map(([c, d]) => `<path class="e ${c}" d="${d}"/>`).join('');
  const color = { '': 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', off: 'var(--off)' };
  html += nodes.map(([id, x, y, name, sub, st]) => {
    const href = st === 'warn' && name.startsWith('192.') ? 'discovery.html' : 'host.html';
    const isPve = id === 'pve';
    return `<a href="${href}"><g class="n ${st}" transform="translate(${x},${y})">
      <rect width="${isPve ? 120 : W}" height="${isPve ? 30 : H}" rx="8"/>
      ${['inet', 'cf', 'pve'].includes(id) ? '' : `<circle class="dotc" cx="${W - 12}" cy="12" r="4.5" fill="${color[st]}"/>`}
      <text x="12" y="${isPve ? 19 : 17}">${name}</text>${isPve ? '' : `<text class="s" x="12" y="31">${sub}</text>`}
    </g></a>`;
  }).join('');
  svg.innerHTML = html;
</script>

</main>
</div>
</div>
</body>
</html>
